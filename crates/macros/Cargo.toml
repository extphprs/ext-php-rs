[package]
name = "ext-php-rs-derive"
description = "Derive macros for ext-php-rs."
repository = "https://github.com/extphprs/ext-php-rs"
homepage = "https://ext-php.rs"
license = "MIT OR Apache-2.0"
version = "0.11.14"
authors = [
    "Xenira <xenira@php.rs>",
    "David Cole <david.cole1340@gmail.com>",
    "Pierre Tondereau <pierre.tondereau@protonmail.com>",
]
edition = "2024"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.3", features = ["full", "extra-traits", "printing"] }
darling = "0.24"
quote = "1.0.9"
proc-macro2 = "1.0.26"
convert_case = "0.12.0"
itertools = "0.15.0"

[lints.rust]
missing_docs = "warn"

[dev-dependencies]
# runtime-macros 1.1.1 declares syn 2 without the `full` and `derive` features it
# uses, relying on unification with the crate under test. Now that this crate is
# on syn 3, enable them explicitly.
syn2 = { package = "syn", version = "2", features = [
    "full",
    "derive",
    "parsing",
    "visit",
    "extra-traits",
] }
glob = "0.3.2"
macrotest = "1.1.0"
runtime-macros = "1.1.1"
rustversion = "1"
